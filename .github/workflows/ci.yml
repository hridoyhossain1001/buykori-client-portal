name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production build
        run: npm run vercel-build

      - name: Test - client routing
        run: npm run test:routing

      - name: Test - analytics service
        run: npm run test:analytics

      - name: Test - courier service
        run: npm run test:courier

      - name: Test - operations service
        run: npm run test:operations

      - name: Test - account service
        run: npm run test:account

      - name: Test - account profile UI
        run: npm run test:account-ui

      - name: Test - HTTP cancellation and timeouts
        run: npm run test:http

      - name: Test - mock API contracts
        run: npm run test:mock-api
